name: Deploy

# Ship on merge to main (CI already passed on the PR). Manual runs from Actions tab still work.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            # Reset first so a dirty VPS working tree (and an outdated deploy.sh)
            # cannot block checkout of the new main.
            cd /opt/apps/dinkboard
            git fetch --depth=1 origin main
            git reset --hard origin/main
            /opt/apps/dinkboard/deploy/deploy.sh
