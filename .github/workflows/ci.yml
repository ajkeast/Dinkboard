name: CI

# Gate merges only — do not re-run on main after merge.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Production build (same-origin API)
        run: npm run build -w client
        env:
          VITE_API_BASE_URL: ""

  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dinkboard
          POSTGRES_PASSWORD: dinkboard
          POSTGRES_DB: dinkboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dinkboard -d dinkboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQL_HOST: localhost
      SQL_USER: dinkboard
      SQL_PASSWORD: dinkboard
      SQL_DATABASE: dinkboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Init Discord ingest schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=dinkboard psql -h localhost -U dinkboard -d dinkboard -f deploy/postgres/init.sql
      - name: Run migrations
        run: npm run migrate
      - name: Run vitest
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: http://localhost:3000
          CLIENT_URL: http://localhost:3000
