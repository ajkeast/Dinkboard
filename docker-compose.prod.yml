# Production stack — used behind the shared Caddy edge proxy.
# From repo root on the VPS:
#   docker network create edge   # once
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  postgres:
    container_name: dinkboard-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dinkboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dinkboard}
    # Localhost only — use SSH tunnel / TablePlus SSH; never expose publicly.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dinkboard} -d ${POSTGRES_DB:-dinkboard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dinkboard

  client:
    container_name: dinkboard-client
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - dinkboard
      - edge

  server:
    container_name: dinkboard-server
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      COOKIE_SECURE: "true"
      CORS_ORIGIN: "https://dinkscord.com,https://www.dinkscord.com"
      CLIENT_URL: "https://dinkscord.com"
      DISCORD_REDIRECT_URI: "https://dinkscord.com/api/auth/discord/callback"
      SQL_HOST: postgres
    networks:
      - dinkboard

volumes:
  postgres_data:

networks:
  dinkboard:
    driver: bridge
  edge:
    external: true
