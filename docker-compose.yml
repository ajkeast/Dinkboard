services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dinkboard
      POSTGRES_PASSWORD: dinkboard
      POSTGRES_DB: dinkboard
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinkboard -d dinkboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dinkboard

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - dinkboard

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      COOKIE_SECURE: "false"
      CORS_ORIGIN: "http://localhost,http://localhost:80"
      SQL_HOST: postgres
      SQL_USER: dinkboard
      SQL_PASSWORD: dinkboard
      SQL_DATABASE: dinkboard
    networks:
      - dinkboard

networks:
  dinkboard:
    driver: bridge
